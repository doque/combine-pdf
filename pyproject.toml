[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "angelflix-scripts"
version = "1.0.0"
description = "PDF utilities for combining, printing, and organizing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pymupdf>=1.23.7",
]

[project.scripts]
angelflix = "angelflix.cli:main"

[tool.setuptools.packages.find]
include = ["angelflix*"]
